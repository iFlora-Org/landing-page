        // ── Noise ──────────────────────────────────────────────────────────────────────
        function noise(x, y, t) {
            x -= Math.floor(x); y -= Math.floor(y);
            return (
                Math.sin(x * 2.3 + t) * Math.cos(y * 1.7 + t * 0.7) * 0.5 +
                Math.sin(x * 0.9 - y * 1.3 + t * 1.1) * 0.3 +
                Math.cos(x * 3.1 + y * 0.8 + t * 0.5) * 0.2
            );
        }

        // ── Easing ─────────────────────────────────────────────────────────────────────
        function easeInOut(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        function easeIn(t) { return t * t * t; }
        function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

        // ── Init dots ──────────────────────────────────────────────────────────────────
        function makeDots() {
            return Array.from({ length: DOT_COUNT }, (_, i) => {
                const angle = Math.random() * Math.PI * 2;
                const u1 = Math.random() + 1e-9, u2 = Math.random();
                const gauss = Math.abs(Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2));
                const r = Math.min(1, gauss * 0.38);
                return {
                    // blob orbit
                    baseAngle: angle,
                    baseR: r,
                    noiseOff: Math.random() * 100,
                    speed: 0.3 + Math.random() * 0.4,
                    size: 1.2 + Math.random() * 1.5,
                    // current rendered position
                    x: 0, y: 0,
                    // shape target (set when forming)
                    tx: 0, ty: 0,
                    // which shape point this dot owns
                    shapeIdx: i % SHAPE_PTS.length,
                };
            });
        }

        // ── Main ───────────────────────────────────────────────────────────────────────
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W, H, cx, cy, baseBlob, shapeScale;
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            W = canvas.width = rect.width * dpr;
            H = canvas.height = rect.height * dpr;
            cx = W / 2; cy = H / 2;
            baseBlob = Math.min(W, H) * 0.54;
            shapeScale = baseBlob * 1.1;
            shapeTargets = buildShapeTargets();
        }
        window.addEventListener('resize', resize);

        const dots = makeDots();

        let scrollBreakProgress = 0;

        // Shape targets in canvas pixels — recomputed from normalized SHAPE_PTS
        // The logo has a slight margin; we want to fit inside the baseBlob radius
        function buildShapeTargets() {
            // The shape spans 0..1 in both axes. Center it.
            return SHAPE_PTS.map(([nx, ny]) => ({
                x: cx + (nx - 0.5) * shapeScale,
                y: cy + (ny - 0.5) * shapeScale * (1137 / 1062), // preserve aspect ratio
            }));
        }

        let shapeTargets = null;
        resize();
        dots.forEach((d) => {
            const sp = shapeTargets[d.shapeIdx];
            d.x = sp.x;
            d.y = sp.y;
        });

        window.addEventListener('message', (event) => {
            const data = event.data || {};
            if (data.type !== 'iflora-blob-scroll') return;

            scrollBreakProgress = Math.max(0, Math.min(1, Number(data.progress) || 0));
        });

        // ── Animation ──────────────────────────────────────────────────────────────────
        let time = 0;
        let renderedBreakProgress = 0;
        const AR = 248, AG = 250, AB = 244; // white particles for video overlay

        function blobPosition(d, t, spreadFactor) {
            const angle = d.baseAngle + t * 0.04;
            const drift = t * d.speed * (1.2 + spreadFactor * 0.5) + d.noiseOff;
            const nv = noise(Math.cos(angle) * 1.5, Math.sin(angle) * 1.5, drift);
            const currentBaseR = baseBlob + spreadFactor * Math.max(W, H) * 0.72;
            const wobble = 1 + nv * (0.06 + spreadFactor * 0.04) * (0.4 + d.baseR * 0.6);
            const r = currentBaseR * wobble;
            return {
                x: cx + Math.cos(angle) * r * d.baseR,
                y: cy + Math.sin(angle) * r * d.baseR,
            };
        }

        function frame() {
            requestAnimationFrame(frame);
            time += 0.005;
            renderedBreakProgress += (scrollBreakProgress - renderedBreakProgress) * 0.085;

            const breakProgress = Math.max(0, Math.min(1, renderedBreakProgress));
            const shapeHold = 1 - breakProgress;
            const spreadFactor = breakProgress;
            const virtualScroll = breakProgress * H * 0.34;

            ctx.clearRect(0, 0, W, H);

            // ── Per-dot update ──
            for (let i = 0; i < dots.length; i++) {
                const d = dots[i];
                const bp = blobPosition(d, time, spreadFactor);
                const sp = shapeTargets[d.shapeIdx];
                const shimmer = Math.sin(time * 3 + d.noiseOff) * 1.5 * shapeHold;
                const shapeX = sp.x + shimmer;
                const shapeY = sp.y - virtualScroll + shimmer * 0.6;
                const tx = bp.x + (shapeX - bp.x) * shapeHold;
                const ty = bp.y + (shapeY - bp.y) * shapeHold;

                // Smooth pursuit
                const lerpFactor = 0.1 + spreadFactor * 0.05;
                d.x += (tx - d.x) * lerpFactor;
                d.y += (ty - d.y) * lerpFactor;

                // Alpha fades with scroll so the mark breaks apart cleanly.
                const centerBright = 1 - d.baseR * 0.55;
                const fadeFactor = Math.max(0.28, 1 - breakProgress * 0.58);
                const pulse = Math.sin(time * 2 + d.noiseOff * 0.3) * 0.15 * shapeHold;
                const alpha = (0.55 + shapeHold * 0.35 + pulse) * centerBright * fadeFactor;

                const sz = d.size * (1 + shapeHold * Math.sin(time * 4 + i * 0.1) * 0.2);

                ctx.beginPath();
                ctx.arc(d.x, d.y, sz, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${AR},${AG},${AB},${Math.max(0, Math.min(1, alpha))})`;
                ctx.fill();
            }

            // ── Connection lines ──
            if (shapeHold > 0.1) {
                ctx.lineWidth = 1.1;
                const linkRange = 38;
                for (let i = 0; i < dots.length; i += 3) {
                    const d1 = dots[i];
                    for (let j = i + 1; j < i + 4; j++) {
                        const d2 = dots[j % dots.length];
                        const dx = d1.x - d2.x, dy = d1.y - d2.y;
                        const dist2 = dx * dx + dy * dy;
                        if (dist2 < linkRange * linkRange) {
                            const outerW = Math.pow(d1.baseR, 1.5);
                            const a = (1 - Math.sqrt(dist2) / linkRange) * 0.35 * outerW * shapeHold;
                            ctx.beginPath();
                            ctx.moveTo(d1.x, d1.y);
                            ctx.lineTo(d2.x, d2.y);
                            ctx.strokeStyle = `rgba(${AR},${AG},${AB},${a})`;
                            ctx.stroke();
                        }
                    }
                }
            }

            // ── Glow ──
            const expand = 1.05 + Math.sin(time * 1.5) * 0.03 * shapeHold;
            const glowR = baseBlob * expand * 1.3;
            const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
            const glowAlpha = 0.08 * shapeHold + 0.025 * (1 - shapeHold);
            grd.addColorStop(0, `rgba(${AR},${AG},${AB},${glowAlpha})`);
            grd.addColorStop(1, `rgba(0,0,0,0)`);
            ctx.beginPath();
            ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
            ctx.fillStyle = grd;
            ctx.fill();

            // ── Logo hold: extra bright inner glow ──
            if (shapeHold > 0.1) {
                const innerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseBlob * 0.7);
                const ig = (0.04 + Math.sin(time * 2) * 0.02) * shapeHold;
                innerGlow.addColorStop(0, `rgba(${AR},${AG},${AB},${ig})`);
                innerGlow.addColorStop(1, `rgba(0,0,0,0)`);
                ctx.beginPath();
                ctx.arc(cx, cy, baseBlob * 0.7, 0, Math.PI * 2);
                ctx.fillStyle = innerGlow;
                ctx.fill();
            }
        }

        requestAnimationFrame(frame);
    </script>
</body>

</html>
